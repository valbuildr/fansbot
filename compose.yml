services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: verysecurepassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
  bot:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:verysecurepassword@db:5432/local
    env_file:
      - .env
    depends_on:
      - db

volumes:
  db_data:
